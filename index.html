<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Burtu Feja — Latvian Reading App</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#f6ecf6" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<!-- Without this the browser falls back to requesting /favicon.ico, which does
     not exist here and logged a 404 on every load. -->
<link rel="icon" href="icons/icon-192.png" type="image/png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<!-- Everything is served from this app: React, Babel and the fonts are all
     vendored, so nothing is fetched from another origin.

     Be clear about what this policy does and does not buy. script-src has to
     allow BOTH 'unsafe-eval' and 'unsafe-inline' because the .jsx files are
     transpiled in the browser by vendor/babel.min.js, which compiles them and
     then injects the result as inline <script> elements. With both keywords
     present, script-src stops approximately nothing — it is there for the
     origin restriction, not as an XSS defence. Making it meaningful means
     moving the app to a real build step, which is a separate job.

     The rest of the policy still does real work: connect-src, img-src,
     font-src and media-src pinned to 'self' mean injected code has nowhere to
     send data, and object-src/base-uri/form-action close the usual side doors.

     frame-ancestors is deliberately absent: browsers ignore it in a <meta>
     policy and log an error for it, and GitHub Pages cannot set headers. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'" />
<meta name="referrer" content="no-referrer" />
<!-- KidMindPath design system, including the shared Quicksand/Nunito webfonts.
     This app used to keep its own vendor/fonts copy of Fredoka+Nunito, from
     before the design system existed; that copy carried the same
     missing-Latvian-diacritics defect as everywhere else, so there was no
     longer a reason to special-case it. Must load before styles.css, which
     resolves var(--kmp-*). -->
<link href="shared/kidmindpath-fonts.css" rel="stylesheet" />
<link href="shared/kidmindpath-tokens.css" rel="stylesheet" />
<link href="shared/kidmindpath-ui.css" rel="stylesheet" />
<!-- Classic script, before the Babel-transpiled app scripts below: they read
     window.KMP at module scope to namespace their storage keys. -->
<script src="shared/kmp.js"></script>
<link href="styles.css" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>

  <!-- PWA: register the offline service worker (plain JS, runs before Babel) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persist().catch(function () {});
      }
    }
  </script>

  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="vendor/babel.min.js"></script>

  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="data.jsx"></script>
  <script type="text/babel" src="game.jsx"></script>
  <script type="text/babel" src="games.jsx"></script>
  <script type="text/babel" src="screens.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
